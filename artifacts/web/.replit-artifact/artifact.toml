kind = "web"
previewPath = "/"
title = "Al-Mujaddidun Platform"
description = "The web platform for Al-Mujaddidun Charity and Development Association. Currently at project-initialization stage: professional folder architecture, tooling configuration (TypeScript, Tailwind, ESLint, Prettier, absolute imports), and bilingual Arabic/English readiness. Features will be developed incrementally in later phases."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "artifacts/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
